<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberFeed — Noticias y CVEs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="bg-grid"></div>

  <header>
    <div class="header-inner">
      <div class="logo">
        <span class="logo-bracket">[</span>
        <span class="logo-text">CYBER</span>
        <span class="logo-accent">FEED</span>
        <span class="logo-bracket">]</span>
      </div>
      <div class="header-meta">
        <span class="last-updated" id="last-updated">Cargando...</span>
        <button class="refresh-btn" onclick="refreshData()" title="Actualizar">↺</button>
      </div>
    </div>
  </header>

  <main>
    <div class="stats-row" id="stats-row">
      <div class="stat-card critical">
        <div class="stat-num" id="stat-critical">—</div>
        <div class="stat-label">CVEs críticos</div>
      </div>
      <div class="stat-card high">
        <div class="stat-num" id="stat-high">—</div>
        <div class="stat-label">CVEs altos</div>
      </div>
      <div class="stat-card news">
        <div class="stat-num" id="stat-news">—</div>
        <div class="stat-label">Noticias</div>
      </div>
    </div>

    <div class="controls">
      <div class="tabs">
        <button class="tab active" data-tab="all" onclick="setTab(this, 'all')">Todo</button>
        <button class="tab" data-tab="cve" onclick="setTab(this, 'cve')">CVEs</button>
        <button class="tab" data-tab="news" onclick="setTab(this, 'news')">Noticias</button>
      </div>
      <div class="filters">
        <select id="severity-filter" onchange="applyFilters()">
          <option value="all">Todas las severidades</option>
          <option value="critical">Solo críticos</option>
          <option value="high">Solo altos</option>
        </select>
        <div class="search-wrap">
          <input type="text" id="search-input" placeholder="Buscar CVE, vendor, tecnología..."
            oninput="applyFilters()" />
          <span class="search-icon">⌕</span>
        </div>
      </div>
    </div>

    <div class="feed" id="feed">
      <div class="loading">
        <div class="spinner"></div>
        <p>Consultando NVD y feeds RSS...</p>
      </div>
    </div>
  </main>

  <footer>
    <p>Fuentes: NVD (NIST) · The Hacker News · BleepingComputer · Krebs on Security · SecurityWeek · CISA</p>
  </footer>

  <script src="/static/js/app.js"></script>
</body>
</html>
